name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            deploy/requirements.txt
            deploy/requirements-dev.txt
      - run: python -m pip install -r deploy/requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python app/ml/verify_inference.py
      - run: python -m pip_audit -r deploy/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Build production image
        run: docker build -t chaineye:ci .
      - name: Verify container and core APIs
        shell: bash
        run: |
          container_name=chaineye-ci
          docker rm --force "$container_name" 2>/dev/null || true
          docker run --detach --rm --name "$container_name" \
            --publish 127.0.0.1::7860 \
            chaineye:ci
          cleanup() {
            docker logs "$container_name" || true
            docker stop "$container_name" || true
          }
          trap cleanup EXIT

          host_port="$(docker port "$container_name" 7860/tcp | head -n1 | awk -F: '{print $NF}')"
          test -n "$host_port"
          python deploy/docker_smoke_test.py \
            --base-url "http://127.0.0.1:$host_port" \
            --timeout-seconds 150
